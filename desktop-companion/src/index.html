<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>바탕화면 키우기</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: absolute;
        inset: 0;
        image-rendering: pixelated;
      }
      #menu {
        display: none;
        position: absolute;
        min-width: 150px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 4px;
        image-rendering: pixelated;
      }
      #menu .item {
        padding: 6px 10px;
        cursor: pointer;
      }
      #menu .item:hover {
        background: #5b8bd9;
        color: #fff;
      }
      #menu .sep {
        height: 2px;
        background: #454a66;
        margin: 4px 2px;
      }
      #menu .stats {
        padding: 6px 10px 2px;
      }
      #menu .stat {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 11px;
        color: #aab0cc;
      }
      #menu .stat span {
        width: 32px;
      }
      #menu .bar {
        flex: 1;
        height: 8px;
        background: #10121b;
        border: 1px solid #454a66;
      }
      #menu .fill {
        height: 100%;
      }
      #wardrobe {
        display: none;
        position: absolute;
        min-width: 190px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #wardrobe .w-title {
        font-size: 13px;
        margin-bottom: 8px;
        color: #aab0cc;
      }
      #wardrobe .w-row {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 7px;
      }
      #wardrobe .w-row span {
        width: 34px;
        color: #aab0cc;
      }
      #wardrobe .swatch {
        width: 18px;
        height: 18px;
        border: 2px solid #454a66;
        cursor: pointer;
        padding: 0;
      }
      #wardrobe .swatch.active {
        border-color: #fff;
      }
      #wardrobe .w-arrow {
        background: #2b2e40;
        border: 2px solid #454a66;
        color: #e8e9f5;
        font-family: inherit;
        font-size: 10px;
        cursor: pointer;
        padding: 2px 5px;
      }
      #wardrobe .w-arrow:hover {
        background: #5b8bd9;
      }
      #wardrobe .w-current {
        flex: 1;
        text-align: center;
        color: #e8e9f5;
      }
      #wardrobe .sep {
        height: 2px;
        background: #454a66;
        margin: 6px 2px;
      }
      #wardrobe .w-close {
        margin-top: 4px;
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #wardrobe .w-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
      /* 수집 앨범 (함께한 날들) — 옷장과 같은 픽셀 스타일 */
      #album {
        display: none;
        position: absolute;
        min-width: 232px;
        max-width: 260px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #album .w-title {
        font-size: 13px;
        margin-bottom: 6px;
        color: #aab0cc;
      }
      #album .a-journal {
        font-size: 11px;
        font-weight: normal;
        color: #aab0cc;
        line-height: 1.5;
        margin-bottom: 8px;
      }
      #album .a-journal b {
        color: #e8e9f5;
      }
      #album .a-grid {
        display: grid;
        grid-template-columns: repeat(6, 32px);
        gap: 4px;
        margin-bottom: 6px;
      }
      #album .a-cell {
        width: 32px;
        height: 32px;
        box-sizing: border-box;
        background: #10121b;
        border: 2px solid #454a66;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        cursor: pointer;
      }
      #album .a-cell.rare {
        border-color: #ffd76a;
      }
      #album .a-cell canvas {
        image-rendering: pixelated;
        width: 24px;
        height: 24px;
      }
      #album .a-cell .a-count {
        position: absolute;
        right: 1px;
        bottom: -1px;
        font-size: 9px;
        color: #ffd76a;
      }
      #album .a-cell.locked {
        color: #454a66;
        font-size: 13px;
        cursor: default;
      }
      #album .a-detail {
        min-height: 28px;
        font-size: 11px;
        font-weight: normal;
        color: #d9c9a0;
        line-height: 1.4;
        margin-bottom: 4px;
      }
      #album .a-close {
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #album .a-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
      /* 할일 목록 — 옷장과 같은 픽셀 스타일 */
      #todo {
        display: none;
        position: absolute;
        min-width: 220px;
        max-width: 260px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #todo .w-title {
        font-size: 13px;
        margin-bottom: 6px;
        color: #aab0cc;
      }
      #todo .t-list {
        max-height: 180px;
        overflow-y: auto;
        margin-bottom: 6px;
      }
      #todo .t-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      #todo .t-check {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        box-sizing: border-box;
        background: #10121b;
        border: 2px solid #454a66;
        color: #7ec46a;
        font-size: 11px;
        line-height: 12px;
        text-align: center;
        cursor: pointer;
        padding: 0;
        font-family: inherit;
        font-weight: bold;
      }
      #todo .t-check:hover {
        border-color: #7ec46a;
      }
      #todo .t-text {
        flex: 1;
        font-weight: normal;
        font-size: 12px;
        word-break: break-all;
      }
      #todo .t-text.done {
        color: #666d8c;
        text-decoration: line-through;
      }
      #todo .t-del {
        background: none;
        border: none;
        color: #666d8c;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        padding: 0 2px;
      }
      #todo .t-del:hover {
        color: #ff9a9a;
      }
      #todo .t-close {
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #todo .t-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
      /* 픽셀 토스트 — 정각 알림/집중 타이머 종료 등 무음 알림 */
      .toast {
        position: absolute;
        transform: translate(-50%, -100%);
        max-width: 240px;
        background: #1d1f2b;
        color: #ffd76a;
        border: 3px solid #ffd76a;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: bold;
        padding: 6px 10px;
        pointer-events: none;
        image-rendering: pixelated;
        transition: opacity 0.5s;
      }
      /* 친구들/기록 패널 — 옷장과 같은 픽셀 스타일 */
      #mp,
      #history {
        display: none;
        position: absolute;
        min-width: 210px;
        max-width: 270px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #mp .w-title,
      #history .w-title {
        font-size: 13px;
        margin-bottom: 8px;
        color: #aab0cc;
      }
      #mp .w-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 7px;
      }
      #mp .w-row span {
        width: 34px;
        color: #aab0cc;
      }
      .w-input {
        flex: 1;
        min-width: 0;
        background: #10121b;
        border: 2px solid #454a66;
        color: #e8e9f5;
        font-family: inherit;
        font-size: 12px;
        font-weight: bold;
        padding: 4px 6px;
      }
      .w-btn {
        background: #2b2e40;
        border: 2px solid #454a66;
        color: #e8e9f5;
        font-family: inherit;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        padding: 5px 10px;
      }
      .w-btn:hover {
        background: #5b8bd9;
      }
      .w-code {
        font-size: 16px;
        letter-spacing: 3px;
        color: #ffd76a;
      }
      .w-note {
        color: #8a90ad;
        font-size: 11px;
        margin: 4px 0 8px;
        font-weight: normal;
      }
      .w-alert {
        color: #ff9a9a;
      }
      .w-addr {
        color: #9ad0ff;
        user-select: text;
        -webkit-user-select: text;
        font-weight: bold;
      }
      #mp .w-close,
      #history .w-close {
        margin-top: 4px;
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #mp .w-close:hover,
      #history .w-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
      .h-list {
        max-height: 180px;
        overflow-y: auto;
        margin-bottom: 4px;
      }
      .h-row {
        display: flex;
        gap: 6px;
        margin-bottom: 3px;
        font-weight: normal;
        font-size: 11px;
      }
      .h-time {
        color: #666d8c;
      }
      .h-name {
        color: #8fb4e8;
        flex-shrink: 0;
      }
      .h-text {
        color: #e8e9f5;
        word-break: break-all;
      }
      /* 채팅 입력 */
      #chat {
        display: none;
        position: absolute;
        width: 220px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        padding: 5px;
        image-rendering: pixelated;
      }
      #chat input {
        width: 100%;
        box-sizing: border-box;
        background: #10121b;
        border: 2px solid #5b8bd9;
        color: #e8e9f5;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: bold;
        padding: 5px 7px;
        outline: none;
      }
      /* 채팅 말풍선 (친구 대화용 — 캐릭터 이모트와 별개) */
      .chatbubble {
        position: absolute;
        transform: translate(-50%, -100%);
        max-width: 220px;
        background: #fdfdf6;
        color: #22242f;
        border: 3px solid #22242f;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: bold;
        padding: 5px 9px;
        pointer-events: none;
        word-break: break-all;
        image-rendering: pixelated;
      }
      /* 화면 엿보기 — 액자 + 승인 패널 */
      .peekframe {
        display: none;
        position: absolute;
        width: 264px;
        background: #1d1f2b;
        border: 4px solid #8a5a3b;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
        padding: 3px;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .peekframe video {
        display: block;
        width: 100%;
        background: #10121b;
      }
      .peeklabel {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        font-weight: bold;
        color: #d9c9a0;
        text-align: center;
        padding: 2px 0 1px;
      }
      #peekreq {
        display: none;
        position: absolute;
        width: 280px;
        background: #1d1f2b;
        border: 3px solid #ffd76a;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #peekreq .w-title {
        font-size: 13px;
        margin-bottom: 6px;
        color: #ffd76a;
      }
      #peekreq .w-row {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubbles"></div>
    <div id="menu"></div>
    <div id="wardrobe"></div>
    <div id="album"></div>
    <div id="todo"></div>
    <div id="mp"></div>
    <div id="history"></div>
    <div id="chat"><input type="text" maxlength="200" placeholder="메시지 입력 후 Enter" /></div>
    <div id="peeks"></div>
    <div id="peekreq"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
