<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>바탕화면 키우기</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: absolute;
        inset: 0;
        image-rendering: pixelated;
      }
      #menu {
        display: none;
        position: absolute;
        min-width: 150px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 4px;
        image-rendering: pixelated;
      }
      #menu .item {
        padding: 6px 10px;
        cursor: pointer;
      }
      #menu .item:hover {
        background: #5b8bd9;
        color: #fff;
      }
      #menu .sep {
        height: 2px;
        background: #454a66;
        margin: 4px 2px;
      }
      #menu .stats {
        padding: 6px 10px 2px;
      }
      #menu .stat {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 11px;
        color: #aab0cc;
      }
      #menu .stat span {
        width: 32px;
      }
      #menu .bar {
        flex: 1;
        height: 8px;
        background: #10121b;
        border: 1px solid #454a66;
      }
      #menu .fill {
        height: 100%;
      }
      #wardrobe {
        display: none;
        position: absolute;
        min-width: 190px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #wardrobe .w-title {
        font-size: 13px;
        margin-bottom: 8px;
        color: #aab0cc;
      }
      #wardrobe .w-row {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 7px;
      }
      #wardrobe .w-row span {
        width: 34px;
        color: #aab0cc;
      }
      #wardrobe .swatch {
        width: 18px;
        height: 18px;
        border: 2px solid #454a66;
        cursor: pointer;
        padding: 0;
      }
      #wardrobe .swatch.active {
        border-color: #fff;
      }
      #wardrobe .w-arrow {
        background: #2b2e40;
        border: 2px solid #454a66;
        color: #e8e9f5;
        font-family: inherit;
        font-size: 10px;
        cursor: pointer;
        padding: 2px 5px;
      }
      #wardrobe .w-arrow:hover {
        background: #5b8bd9;
      }
      #wardrobe .w-current {
        flex: 1;
        text-align: center;
        color: #e8e9f5;
      }
      #wardrobe .sep {
        height: 2px;
        background: #454a66;
        margin: 6px 2px;
      }
      #wardrobe .w-close {
        margin-top: 4px;
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #wardrobe .w-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="menu"></div>
    <div id="wardrobe"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
