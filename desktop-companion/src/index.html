<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>바탕화면 키우기</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: absolute;
        inset: 0;
        image-rendering: pixelated;
      }
      /* 모든 패널은 제목/빈 영역을 잡고 드래그로 이동 가능 */
      .w-title {
        cursor: move;
      }
      #menu {
        display: none;
        position: absolute;
        min-width: 150px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 4px;
        image-rendering: pixelated;
      }
      #menu .item {
        padding: 6px 10px;
        cursor: pointer;
      }
      #menu .item:hover {
        background: #5b8bd9;
        color: #fff;
      }
      #menu .sep {
        height: 2px;
        background: #454a66;
        margin: 4px 2px;
      }
      #wardrobe {
        display: none;
        position: absolute;
        min-width: 190px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #wardrobe .w-title {
        font-size: 13px;
        margin-bottom: 8px;
        color: #aab0cc;
      }
      #wardrobe .w-row {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 7px;
      }
      #wardrobe .w-row span {
        width: 34px;
        color: #aab0cc;
      }
      #wardrobe .swatch {
        width: 18px;
        height: 18px;
        border: 2px solid #454a66;
        cursor: pointer;
        padding: 0;
      }
      #wardrobe .swatch.active {
        border-color: #fff;
      }
      #wardrobe .w-arrow {
        background: #2b2e40;
        border: 2px solid #454a66;
        color: #e8e9f5;
        font-family: inherit;
        font-size: 10px;
        cursor: pointer;
        padding: 2px 5px;
      }
      #wardrobe .w-arrow:hover {
        background: #5b8bd9;
      }
      #wardrobe .w-current {
        flex: 1;
        text-align: center;
        color: #e8e9f5;
      }
      #wardrobe .sep {
        height: 2px;
        background: #454a66;
        margin: 6px 2px;
      }
      #wardrobe .w-close {
        margin-top: 4px;
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #wardrobe .w-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
      /* 수집 앨범 (함께한 날들) — 옷장과 같은 픽셀 스타일 */
      #album {
        display: none;
        position: absolute;
        min-width: 232px;
        max-width: 260px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #album .w-title {
        font-size: 13px;
        margin-bottom: 6px;
        color: #aab0cc;
      }
      #album .a-journal {
        font-size: 11px;
        font-weight: normal;
        color: #aab0cc;
        line-height: 1.5;
        margin-bottom: 8px;
      }
      #album .a-journal b {
        color: #e8e9f5;
      }
      #album .a-grid {
        display: grid;
        grid-template-columns: repeat(6, 32px);
        gap: 4px;
        margin-bottom: 6px;
      }
      #album .a-cell {
        width: 32px;
        height: 32px;
        box-sizing: border-box;
        background: #10121b;
        border: 2px solid #454a66;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        cursor: pointer;
      }
      #album .a-cell.rare {
        border-color: #ffd76a;
      }
      #album .a-cell canvas {
        image-rendering: pixelated;
        width: 24px;
        height: 24px;
      }
      #album .a-cell .a-count {
        position: absolute;
        right: 1px;
        bottom: -1px;
        font-size: 9px;
        color: #ffd76a;
      }
      #album .a-cell.locked {
        color: #454a66;
        font-size: 13px;
        cursor: default;
      }
      #album .a-detail {
        min-height: 28px;
        font-size: 11px;
        font-weight: normal;
        color: #d9c9a0;
        line-height: 1.4;
        margin-bottom: 4px;
      }
      #album .a-close {
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #album .a-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
      /* 엣지패널 방 — 화면 가장자리 핸들 + 슬라이드 방 창 */
      #edgehandle {
        position: absolute;
        width: 12px;
        height: 72px;
        background: #2b2e40;
        border: 2px solid #454a66;
        opacity: 0.55;
        cursor: pointer;
        z-index: 5;
      }
      #edgehandle:hover {
        opacity: 1;
        background: #454a66;
      }
      #edgehandle .grip {
        position: absolute;
        left: 3px;
        top: 14px;
        width: 2px;
        height: 44px;
        background: #8a90ad;
        box-shadow: 4px 0 0 #8a90ad;
      }
      #room {
        display: none;
        position: absolute;
        width: 264px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
        z-index: 6;
      }
      #room .w-title {
        font-size: 13px;
        margin-bottom: 6px;
        color: #aab0cc;
      }
      /* 방 안 풍경 — 집에 있는 캐릭터들이 모여 앉는 곳 */
      #room .r-scene {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        min-height: 64px;
        background: #2b2436;
        border: 2px solid #454a66;
        border-bottom: 6px solid #57405a;
        padding: 6px 10px 2px;
        margin-bottom: 6px;
        overflow-x: auto;
      }
      #room .r-resident {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
      }
      #room .r-resident canvas {
        image-rendering: pixelated;
      }
      #room .r-resident span {
        font-size: 9px;
        color: #aab0cc;
        max-width: 52px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #room .r-empty {
        color: #666d8c;
        font-size: 11px;
        font-weight: normal;
        align-self: center;
        margin: auto;
      }
      /* 벽면 그림판 */
      #room .r-board {
        display: block;
        background: #fdfdf6;
        border: 3px solid #8a5a3b;
        cursor: crosshair;
        touch-action: none;
      }
      #room .r-tools {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 5px 0 7px;
      }
      #room .r-color {
        width: 16px;
        height: 16px;
        border: 2px solid #454a66;
        cursor: pointer;
        padding: 0;
      }
      #room .r-color.active {
        border-color: #fff;
      }
      #room .r-links {
        max-height: 110px;
        overflow-y: auto;
        margin-bottom: 5px;
      }
      #room .r-link {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 3px;
      }
      #room .r-link a {
        flex: 1;
        color: #9ad0ff;
        cursor: pointer;
        font-weight: normal;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-decoration: underline;
      }
      #room .r-link a:hover {
        color: #cfe7ff;
      }
      #room .r-close {
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #room .r-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
      /* 엣지패널 방 v2 — 2.5D 거실 */
      #peerhandles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .edgehandle-peer {
        position: absolute;
        pointer-events: auto;
        width: 12px;
        height: 44px;
        background: #2b3a2e;
        border: 2px solid #5f9e54;
        opacity: 0.6;
        cursor: pointer;
        z-index: 5;
        color: #93c47d;
        font-family: 'Courier New', monospace;
        font-size: 9px;
        font-weight: bold;
        text-align: center;
        line-height: 44px;
        overflow: hidden;
      }
      .edgehandle-peer:hover {
        opacity: 1;
      }
      #room .r-scene-canvas {
        display: block;
        border: 2px solid #454a66;
        image-rendering: pixelated;
        margin-bottom: 6px;
      }
      #room .r-scene-canvas.editing {
        border-color: #ffd76a;
        cursor: grab;
      }
      #room .r-btns {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      #room .r-furnrow {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      #room .r-furnrow .w-btn {
        font-size: 11px;
        padding: 3px 6px;
      }
      .w-btn.r-active {
        background: #5b8bd9;
        color: #fff;
      }
      /* 그림판/보드 팝업 */
      #wb,
      #board {
        display: none;
        position: absolute;
        min-width: 240px;
        max-width: 300px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
        z-index: 7;
      }
      #wb .w-title,
      #board .w-title {
        font-size: 13px;
        margin-bottom: 4px;
        color: #aab0cc;
      }
      #board .b-link {
        flex: 1;
        color: #9ad0ff;
        cursor: pointer;
        font-weight: normal;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-decoration: underline;
      }
      #board .b-link:hover {
        color: #cfe7ff;
      }
      #board .t-list {
        max-height: 170px;
        overflow-y: auto;
        margin: 6px 0;
      }
      #board .t-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      #board .t-text {
        flex: 1;
        font-weight: normal;
        font-size: 12px;
        word-break: break-all;
      }
      #board .t-del,
      #wb .t-del {
        background: none;
        border: none;
        color: #666d8c;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        padding: 0 2px;
      }
      #board .t-del:hover {
        color: #ff9a9a;
      }
      /* 할일 목록 — 옷장과 같은 픽셀 스타일 */
      #todo {
        display: none;
        position: absolute;
        min-width: 220px;
        max-width: 260px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #todo .w-title {
        font-size: 13px;
        margin-bottom: 6px;
        color: #aab0cc;
      }
      #todo .t-list {
        max-height: 180px;
        overflow-y: auto;
        margin-bottom: 6px;
      }
      #todo .t-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      #todo .t-check {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        box-sizing: border-box;
        background: #10121b;
        border: 2px solid #454a66;
        color: #7ec46a;
        font-size: 11px;
        line-height: 12px;
        text-align: center;
        cursor: pointer;
        padding: 0;
        font-family: inherit;
        font-weight: bold;
      }
      #todo .t-check:hover {
        border-color: #7ec46a;
      }
      #todo .t-text {
        flex: 1;
        font-weight: normal;
        font-size: 12px;
        word-break: break-all;
      }
      #todo .t-text.done {
        color: #666d8c;
        text-decoration: line-through;
      }
      #todo .t-del {
        background: none;
        border: none;
        color: #666d8c;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        padding: 0 2px;
      }
      #todo .t-del:hover {
        color: #ff9a9a;
      }
      #todo .t-close {
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #todo .t-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
      /* 픽셀 토스트 — 정각 알림/집중 타이머 종료 등 무음 알림 */
      .toast {
        position: absolute;
        transform: translate(-50%, -100%);
        max-width: 240px;
        background: #1d1f2b;
        color: #ffd76a;
        border: 3px solid #ffd76a;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: bold;
        padding: 6px 10px;
        pointer-events: none;
        image-rendering: pixelated;
        transition: opacity 0.5s;
      }
      /* 친구들/기록 패널 — 옷장과 같은 픽셀 스타일 */
      #mp,
      #history {
        display: none;
        position: absolute;
        min-width: 210px;
        max-width: 270px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #mp .w-title,
      #history .w-title {
        font-size: 13px;
        margin-bottom: 8px;
        color: #aab0cc;
      }
      #mp .w-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 7px;
      }
      #mp .w-row span {
        width: 34px;
        color: #aab0cc;
      }
      .w-input {
        flex: 1;
        min-width: 0;
        background: #10121b;
        border: 2px solid #454a66;
        color: #e8e9f5;
        font-family: inherit;
        font-size: 12px;
        font-weight: bold;
        padding: 4px 6px;
      }
      .w-btn {
        background: #2b2e40;
        border: 2px solid #454a66;
        color: #e8e9f5;
        font-family: inherit;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        padding: 5px 10px;
      }
      .w-btn:hover {
        background: #5b8bd9;
      }
      .w-code {
        font-size: 16px;
        letter-spacing: 3px;
        color: #ffd76a;
      }
      .w-note {
        color: #8a90ad;
        font-size: 11px;
        margin: 4px 0 8px;
        font-weight: normal;
      }
      .w-alert {
        color: #ff9a9a;
      }
      .w-addr {
        color: #9ad0ff;
        user-select: text;
        -webkit-user-select: text;
        font-weight: bold;
      }
      #mp .w-close,
      #history .w-close {
        margin-top: 4px;
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }
      #mp .w-close:hover,
      #history .w-close:hover {
        background: #5b8bd9;
        color: #fff;
      }
      .h-list {
        max-height: 180px;
        overflow-y: auto;
        margin-bottom: 4px;
      }
      .h-row {
        display: flex;
        gap: 6px;
        margin-bottom: 3px;
        font-weight: normal;
        font-size: 11px;
      }
      .h-time {
        color: #666d8c;
      }
      .h-name {
        color: #8fb4e8;
        flex-shrink: 0;
      }
      .h-text {
        color: #e8e9f5;
        word-break: break-all;
      }
      /* 채팅 입력 */
      #chat {
        display: none;
        position: absolute;
        width: 220px;
        background: #1d1f2b;
        border: 3px solid #454a66;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        padding: 5px;
        image-rendering: pixelated;
      }
      #chat input {
        width: 100%;
        box-sizing: border-box;
        background: #10121b;
        border: 2px solid #5b8bd9;
        color: #e8e9f5;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: bold;
        padding: 5px 7px;
        outline: none;
      }
      /* 채팅 말풍선 (친구 대화용 — 캐릭터 이모트와 별개) */
      .chatbubble {
        position: absolute;
        transform: translate(-50%, -100%);
        max-width: 220px;
        background: #fdfdf6;
        color: #22242f;
        border: 3px solid #22242f;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: bold;
        padding: 5px 9px;
        pointer-events: none;
        word-break: break-all;
        image-rendering: pixelated;
      }
      /* 화면 엿보기 — 액자 + 승인 패널 */
      .peekframe {
        display: none;
        position: absolute;
        width: 264px;
        background: #1d1f2b;
        border: 4px solid #8a5a3b;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
        padding: 3px;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .peekframe video {
        display: block;
        width: 100%;
        background: #10121b;
      }
      .peeklabel {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        font-weight: bold;
        color: #d9c9a0;
        text-align: center;
        padding: 2px 0 1px;
      }
      #peekreq {
        display: none;
        position: absolute;
        width: 280px;
        background: #1d1f2b;
        border: 3px solid #ffd76a;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: bold;
        color: #e8e9f5;
        padding: 8px;
        image-rendering: pixelated;
      }
      #peekreq .w-title {
        font-size: 13px;
        margin-bottom: 6px;
        color: #ffd76a;
      }
      #peekreq .w-row {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubbles"></div>
    <div id="menu"></div>
    <div id="wardrobe"></div>
    <div id="album"></div>
    <div id="todo"></div>
    <div id="edgehandle"><div class="grip"></div></div>
    <div id="peerhandles"></div>
    <div id="room"></div>
    <div id="wb"></div>
    <div id="board"></div>
    <div id="mp"></div>
    <div id="history"></div>
    <div id="chat"><input type="text" maxlength="200" placeholder="메시지 입력 후 Enter" /></div>
    <div id="peeks"></div>
    <div id="peekreq"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
