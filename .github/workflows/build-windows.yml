# 설치 파일 빌드 (Windows + macOS) — push마다 자동 실행, 하나의 Release에 함께 업로드
# 결과물: https://github.com/erie-pixel/ClaudeBusiness/releases 에서 다운로드
name: Build Installers

on:
  workflow_dispatch:
  push:
    branches: ['claude/desktop-companion-game-012c1u']
    paths:
      - 'desktop-companion/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: build-installers
  cancel-in-progress: true

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-companion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build app bundles
        run: npm run build

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop-companion/release/*.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-companion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build app bundles
        run: npm run build

      - name: Compile macOS watcher helper (universal — 창 구경하기/같이 일하기/방치 감지)
        run: |
          mkdir -p build
          swiftc -O -target arm64-apple-macosx11.0 native/mac-watcher.swift -o build/mac-watcher-arm64
          swiftc -O -target x86_64-apple-macosx11.0 native/mac-watcher.swift -o build/mac-watcher-x64
          lipo -create build/mac-watcher-arm64 build/mac-watcher-x64 -output build/mac-watcher
          chmod +x build/mac-watcher
          lipo -info build/mac-watcher

      - name: Build DMG (universal, unsigned)
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: desktop-companion/release/*.dmg
          if-no-files-found: error

  release:
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release (공유용 다운로드 링크)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: 바탕화면 키우기 개발 빌드 ${{ github.run_number }}
          prerelease: true
          body: |
            개발 빌드 (코드 서명 없음). 커밋: ${{ github.sha }}

            - **Windows**: `.exe` 실행 — SmartScreen 경고가 뜨면 "추가 정보 → 실행"
            - **macOS**: `.dmg` 열고 앱을 Applications로 드래그 → 첫 실행 시
              "확인되지 않은 개발자" 경고가 뜨면 Finder에서 앱을 **우클릭 → 열기**.
              그래도 "손상되었습니다"가 뜨면 터미널에서:
              `xattr -cr "/Applications/Desktop Companion.app"` 후 다시 열기.
          files: artifacts/**/*
